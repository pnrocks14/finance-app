name: finance_workspace
description: Workspace root for the personal finance app. Not a package itself.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/finance_core
  - packages/finance_data
  - packages/finance_ui_kit

# Encrypted SQLite: package:sqlite3 bundles SQLite3MultipleCiphers instead of
# plain SQLite on every native platform. See docs/adr/0002-local-database.md.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
