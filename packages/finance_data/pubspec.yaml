publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  finance_core:
    path: ../finance_core
  cryptography: ^2.9.0
  drift: ^2.35.2
  flutter_secure_storage: ^11.2.0
  path: ^1.9.0
  path_provider: ^2.1.6
  sqlite3: ^3.7.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
