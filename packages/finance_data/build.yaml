targets:
  $default:
    builders:
      drift_dev:
        options:
          # Instants are stored as ISO-8601 text, so the database is readable
          # and dates mean the same thing to every tool and AI that reads it.
          store_date_time_values_as_text: true
          databases:
            finance: lib/src/db/database.dart
          schema_dir: drift_schemas/
          test_dir: test/generated_migrations/
